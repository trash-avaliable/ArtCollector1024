<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RefCollector · 扩展设置</title>
<style>
  :root {
    --bg: #eef0ea; --ink: #1a1c17; --muted: #6f746a; --line: #dfe3d7; --signal: #fffa00;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; padding: 28px 24px; background: var(--bg); color: var(--ink);
    font: 13px/1.6 "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 15px; letter-spacing: .06em; }
  .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 20px; }
  label { display: block; font-size: 11px; letter-spacing: .1em; color: var(--muted); margin: 14px 0 5px; }
  input { width: 100%; max-width: 420px; height: 34px; padding: 0 9px; background: #fff;
    border: 1px solid var(--line); font: 12.5px var(--mono); }
  input:focus { outline: none; border-color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; max-width: 420px; }
  button { height: 34px; padding: 0 14px; border: 1px solid var(--ink); background: #fff;
    font-size: 12px; cursor: pointer; transition: background .16s, color .16s; }
  button:hover { background: var(--ink); color: #fff; }
  button.primary { background: var(--signal); border-color: var(--ink); font-weight: 600; }
  button.primary:hover { filter: brightness(.96); color: var(--ink); }
  #state { margin-top: 14px; font: 11.5px var(--mono); letter-spacing: .04em; }
  .ok { color: #1a7f4b; } .bad { color: #c73b3b; }
  .tip { margin-top: 22px; padding: 12px; border: 1px solid var(--line); background: #fff;
    font-size: 11.5px; color: var(--muted); max-width: 520px; }
  .tip b { color: var(--ink); }
  ol { margin: 8px 0 0; padding-left: 18px; }
  li { margin: 3px 0; }
</style>
</head>
<body>
  <h1>REFCOLLECTOR / 扩展设置</h1>
  <div class="sub">填好端口和令牌后，网页图片右键即可入库。</div>

  <label>端口</label>
  <input id="port" value="47821" inputmode="numeric">

  <label>令牌（在 RefCollector 的「设置」里复制）</label>
  <input id="token" placeholder="例如 3f9c1a7b2d4e5f60">

  <div class="row" style="margin-top:16px">
    <button class="primary" id="save">保存</button>
    <button id="test">测试连接</button>
  </div>
  <div id="state"></div>

  <div class="tip">
    <b>装法</b>
    <ol>
      <li>打开 <code>chrome://extensions</code>，右上角开启「开发者模式」</li>
      <li>点「加载已解压的扩展程序」，选 RefCollector 安装目录下的 <code>extension</code> 文件夹</li>
      <li>在网页图片上右键 →「存进 RefCollector」</li>
    </ol>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const state = (txt, cls) => { $('state').textContent = txt; $('state').className = cls || ''; };

  chrome.storage.local.get({ port: 47821, token: '' }, (s) => {
    $('port').value = s.port || 47821;
    $('token').value = s.token || '';
  });

  $('save').onclick = () => {
    const port = Number($('port').value) || 47821;
    const token = $('token').value.trim();
    chrome.storage.local.set({ port, token }, () => state('已保存', 'ok'));
  };

  $('test').onclick = async () => {
    const port = Number($('port').value) || 47821;
    state('连接中…');
    try {
      const r = await fetch(`http://127.0.0.1:${port}/ping`);
      const j = await r.json();
      state(`已连接 · ${j.app} · 库里 ${j.count} 张`, 'ok');
    } catch (e) {
      state('连不上：确认 RefCollector 正在运行，端口没被占用', 'bad');
    }
  };
</script>
</body>
</html>
